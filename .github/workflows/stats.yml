name: Generate GitHub Stats Card
on:
  schedule:
    - cron: "0 3 * * *"   # once a day at 3am UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # lets the action commit the generated image back to this repo

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate the user stats image
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/userstats.svg
          include-title: false
          colors: '#0d1a42 #1A2F6F #C49639 #C49639 #ffffff'
          border-radius: 16
          hide-keys: joined, mostForked, followers, following, sponsors, sponsoring
          category-order: repositories, contributions, languages
          animated-language-chart: true
          language-animation-speed: 14
          commit-and-push: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push (with retry on race conditions)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add images/userstats.svg
            if git diff --cached --quiet; then
              echo "No changes to commit."
              break
            fi
            git commit -m "Update GitHub stats card"
            git pull --rebase origin main
            if git push origin main; then
              echo "Pushed successfully."
              break
            fi
            echo "Push rejected, retrying ($i)..."
            sleep 5
          done
