<svg width="1200" height="100" viewBox="0 0 1200 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#1a0a2e;#0d1117" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1a0a2e">
        <animate attributeName="stop-color" values="#1a0a2e;#2d1b69;#1a0a2e" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#161b22">
        <animate attributeName="stop-color" values="#161b22;#0d1117;#161b22" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#F72585" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7209B7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FF6B35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F72585" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#F72585"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </linearGradient>

    <radialGradient id="ftOrb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F72585" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F72585" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ftOrb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes ftPulse1 { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
      @keyframes ftPulse2 { 0%,100% { transform: scale(1.1); } 50% { transform: scale(0.85); } }
      @keyframes ftFloat { 0%,100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(-8px); opacity: 0.9; } }
      @keyframes ftShimmer { 0%,100% { opacity: 0.2; } 50% { opacity: 0.7; } }
      .ft-orb1 { animation: ftPulse1 10s ease-in-out infinite; transform-origin: 300px 60px; }
      .ft-orb2 { animation: ftPulse2 12s ease-in-out infinite; transform-origin: 900px 40px; }
      .ft-p1 { animation: ftFloat 5s ease-in-out infinite; }
      .ft-p2 { animation: ftFloat 7s ease-in-out infinite; }
      .ft-p3 { animation: ftFloat 6s ease-in-out infinite; }
      .ft-p4 { animation: ftFloat 8s ease-in-out infinite; }
      .ft-p5 { animation: ftFloat 5.5s ease-in-out infinite; }
      .ft-p6 { animation: ftFloat 6.5s ease-in-out infinite; }
      .ft-s1 { animation: ftShimmer 4s ease-in-out infinite; }
      .ft-s2 { animation: ftShimmer 5.5s ease-in-out infinite; }
      .ft-s3 { animation: ftShimmer 7s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="100" fill="url(#ftBg)"/>

  <!-- Top wave -->
  <path d="M0,15 C200,5 400,30 600,15 C800,0 1000,25 1200,10 L1200,0 L0,0 Z" fill="url(#waveGrad)">
    <animate attributeName="d" values="M0,15 C200,5 400,30 600,15 C800,0 1000,25 1200,10 L1200,0 L0,0 Z;M0,10 C200,25 400,5 600,18 C800,30 1000,5 1200,15 L1200,0 L0,0 Z;M0,15 C200,5 400,30 600,15 C800,0 1000,25 1200,10 L1200,0 L0,0 Z" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Second wave layer -->
  <path d="M0,25 C300,10 600,35 900,20 C1050,12 1150,28 1200,22 L1200,0 L0,0 Z" fill="url(#waveGrad2)">
    <animate attributeName="d" values="M0,25 C300,10 600,35 900,20 C1050,12 1150,28 1200,22 L1200,0 L0,0 Z;M0,20 C300,35 600,10 900,28 C1050,35 1150,15 1200,20 L1200,0 L0,0 Z;M0,25 C300,10 600,35 900,20 C1050,12 1150,28 1200,22 L1200,0 L0,0 Z" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Glowing orbs -->
  <circle class="ft-orb1" cx="300" cy="60" r="120" fill="url(#ftOrb1)"/>
  <circle class="ft-orb2" cx="900" cy="40" r="100" fill="url(#ftOrb2)"/>

  <!-- Floating particles -->
  <circle class="ft-p1" cx="100" cy="50" r="1.5" fill="#FF6B35" opacity="0.5"/>
  <circle class="ft-p2" cx="350" cy="70" r="1.2" fill="#F72585" opacity="0.4"/>
  <circle class="ft-p3" cx="550" cy="45" r="1.8" fill="#7209B7" opacity="0.5"/>
  <circle class="ft-p4" cx="750" cy="75" r="1.3" fill="#FF6B35" opacity="0.4"/>
  <circle class="ft-p5" cx="950" cy="55" r="1.6" fill="#F72585" opacity="0.5"/>
  <circle class="ft-p6" cx="1100" cy="65" r="1.2" fill="#7209B7" opacity="0.4"/>

  <!-- Shimmer stars -->
  <circle class="ft-s1" cx="200" cy="85" r="0.8" fill="#E6EDF3" opacity="0.2"/>
  <circle class="ft-s2" cx="600" cy="80" r="1" fill="#E6EDF3" opacity="0.2"/>
  <circle class="ft-s3" cx="1000" cy="88" r="0.9" fill="#E6EDF3" opacity="0.2"/>

  <!-- Bottom accent line -->
  <rect x="200" y="95" width="800" height="1" rx="0.5" fill="url(#lineGrad)" opacity="0.3">
    <animate attributeName="width" values="800;850;800" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="200;175;200" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
