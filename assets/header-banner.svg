<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#1a0a2e;#0d1117" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1a0a2e">
        <animate attributeName="stop-color" values="#1a0a2e;#2d1b69;#1a0a2e" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#161b22">
        <animate attributeName="stop-color" values="#161b22;#0d1117;#161b22" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F72585" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F72585" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7209B7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#F72585"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes float1 { 0%,100% { transform: translateY(0px); opacity: 0.6; } 50% { transform: translateY(-20px); opacity: 1; } }
      @keyframes float2 { 0%,100% { transform: translateY(0px); opacity: 0.4; } 50% { transform: translateY(-30px); opacity: 0.9; } }
      @keyframes float3 { 0%,100% { transform: translateY(0px); opacity: 0.5; } 50% { transform: translateY(-15px); opacity: 0.8; } }
      @keyframes pulse1 { 0%,100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.15); opacity: 0.8; } }
      @keyframes pulse2 { 0%,100% { transform: scale(1.1); opacity: 0.4; } 50% { transform: scale(0.9); opacity: 0.7; } }
      @keyframes pulse3 { 0%,100% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 0.75; } }
      @keyframes shimmer { 0% { opacity: 0.3; } 50% { opacity: 0.8; } 100% { opacity: 0.3; } }
      @keyframes drift { 0% { transform: translateX(0); } 50% { transform: translateX(10px); } 100% { transform: translateX(0); } }

      .p1 { animation: float1 6s ease-in-out infinite; }
      .p2 { animation: float2 8s ease-in-out infinite; }
      .p3 { animation: float3 5s ease-in-out infinite; }
      .p4 { animation: float1 7s ease-in-out infinite; }
      .p5 { animation: float2 9s ease-in-out infinite; }
      .p6 { animation: float3 6.5s ease-in-out infinite; }
      .p7 { animation: float1 5.5s ease-in-out infinite; }
      .p8 { animation: float2 7.5s ease-in-out infinite; }
      .p9 { animation: float3 8.5s ease-in-out infinite; }
      .p10 { animation: float1 4.5s ease-in-out infinite; }
      .p11 { animation: float2 6s ease-in-out infinite; }
      .p12 { animation: float3 7s ease-in-out infinite; }
      .p13 { animation: float1 9.5s ease-in-out infinite; }
      .p14 { animation: float2 5s ease-in-out infinite; }
      .p15 { animation: float3 8s ease-in-out infinite; }
      .p16 { animation: shimmer 4s ease-in-out infinite; }
      .p17 { animation: shimmer 6s ease-in-out infinite; }
      .p18 { animation: shimmer 5s ease-in-out infinite; }

      .orb1 { animation: pulse1 10s ease-in-out infinite; transform-origin: 200px 150px; }
      .orb2 { animation: pulse2 12s ease-in-out infinite; transform-origin: 900px 100px; }
      .orb3 { animation: pulse3 14s ease-in-out infinite; transform-origin: 600px 250px; }

      .line { animation: drift 12s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.03">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#E6EDF3" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#E6EDF3" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#E6EDF3" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#E6EDF3" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#E6EDF3" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="300" stroke="#E6EDF3" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#E6EDF3" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="300" stroke="#E6EDF3" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="300" stroke="#E6EDF3" stroke-width="0.5"/>
  </g>

  <!-- Glowing orbs -->
  <circle class="orb1" cx="200" cy="150" r="180" fill="url(#orb1)"/>
  <circle class="orb2" cx="900" cy="100" r="200" fill="url(#orb2)"/>
  <circle class="orb3" cx="600" cy="250" r="160" fill="url(#orb3)"/>

  <!-- Floating particles -->
  <circle class="p1" cx="80" cy="50" r="2" fill="#FF6B35" opacity="0.6"/>
  <circle class="p2" cx="150" cy="200" r="1.5" fill="#F72585" opacity="0.5"/>
  <circle class="p3" cx="250" cy="80" r="2.5" fill="#7209B7" opacity="0.4"/>
  <circle class="p4" cx="350" cy="250" r="1.8" fill="#FF6B35" opacity="0.5"/>
  <circle class="p5" cx="450" cy="60" r="2" fill="#F72585" opacity="0.6"/>
  <circle class="p6" cx="550" cy="220" r="1.5" fill="#7209B7" opacity="0.4"/>
  <circle class="p7" cx="650" cy="40" r="2.2" fill="#FF6B35" opacity="0.5"/>
  <circle class="p8" cx="750" cy="180" r="1.8" fill="#F72585" opacity="0.6"/>
  <circle class="p9" cx="850" cy="90" r="2" fill="#7209B7" opacity="0.4"/>
  <circle class="p10" cx="950" cy="260" r="1.5" fill="#FF6B35" opacity="0.5"/>
  <circle class="p11" cx="1050" cy="70" r="2.5" fill="#F72585" opacity="0.6"/>
  <circle class="p12" cx="1120" cy="200" r="1.8" fill="#7209B7" opacity="0.4"/>
  <circle class="p13" cx="100" cy="270" r="2" fill="#FF6B35" opacity="0.3"/>
  <circle class="p14" cx="500" cy="140" r="1.5" fill="#F72585" opacity="0.5"/>
  <circle class="p15" cx="1000" cy="160" r="2.2" fill="#7209B7" opacity="0.4"/>

  <!-- Shimmer stars -->
  <circle class="p16" cx="300" cy="30" r="1" fill="#E6EDF3" opacity="0.3"/>
  <circle class="p17" cx="700" cy="25" r="1.2" fill="#E6EDF3" opacity="0.3"/>
  <circle class="p18" cx="1100" cy="45" r="0.8" fill="#E6EDF3" opacity="0.3"/>

  <!-- Decorative line -->
  <g class="line" opacity="0.15">
    <line x1="100" y1="280" x2="1100" y2="280" stroke="url(#textGlow)" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Main heading -->
  <text x="600" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" fill="url(#textGlow)" text-anchor="middle" filter="url(#glow)">Devansh Gupta</text>

  <!-- Subtitle -->
  <text x="600" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#E6EDF3" text-anchor="middle" opacity="0.9" filter="url(#softGlow)">Full-Stack &amp; AI/ML Developer</text>

  <!-- Accent line under subtitle -->
  <rect x="520" y="180" width="160" height="2" rx="1" fill="url(#textGlow)" opacity="0.6">
    <animate attributeName="width" values="160;200;160" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="520;500;520" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Location tag -->
  <text x="600" y="215" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300" fill="#8B949E" text-anchor="middle">Bengaluru, India</text>

  <!-- Bottom wave -->
  <path d="M0,270 C200,250 400,290 600,270 C800,250 1000,290 1200,270 L1200,300 L0,300 Z" fill="#0d1117" opacity="0.5">
    <animate attributeName="d" values="M0,270 C200,250 400,290 600,270 C800,250 1000,290 1200,270 L1200,300 L0,300 Z;M0,275 C200,295 400,255 600,275 C800,295 1000,255 1200,275 L1200,300 L0,300 Z;M0,270 C200,250 400,290 600,270 C800,250 1000,290 1200,270 L1200,300 L0,300 Z" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>
